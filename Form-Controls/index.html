<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <!-- collect name and validate it -->
        <label for="name">Name *:</label>
        <input type="text" id="name" name="name" minlength="2" required>
        <!-- email and validation -->
        <label for="email">Email *:</label>
        <input type="email" id="email" name="email" required>
        <!-- color - 3 options must choose 1 -->
        <fieldset>
          <legend>Choose a color *:</legend>
          <input type="radio" name="color" id="black" value="black" required>
          <label for="black">Black</label>
          <input type="radio" name="color" id="white" value="white" required>
          <label for="white">White</label>
          <input type="radio" name="color" id="red" value="red" required>
          <label for="red">Red</label>
        </fieldset>
        <!-- size - 6 options  -->
        <label for="size">Choose a size *:</label>
        <select id="size" name="size" required>
          <option value="">Choose a size</option>
          <option value="xs">XS</option>
          <option value="s">S</option>
          <option value="m">M</option>
          <option value="l">L</option>
          <option value="xl">XL</option>
          <option value="xxl">XXL</option>
        </select>
        <!-- button -->
        <br>
        <button type="submit">Order</button>
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By Trang Do Thuy</h2>
    </footer>
  </body>
</html>
